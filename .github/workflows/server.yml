# kan! server CI: typecheck, lint and the whole jest suite against a real
# PostgreSQL 16.
#
# The suite has two halves (server/app/README.md "Tests"): unit tests that run
# anywhere, and the client-flow e2e suite, which walks the osu!lazer client's
# protocol against a database and creates a throwaway kan_test database in the
# service below. The service mirrors server/app/docker-compose.yml (user kan,
# password kan, host port 55432) so a local run and a CI run use the same
# TEST_DATABASE_URL.
#
# Actions are pinned by commit SHA with the release in a comment (November
# 2026 audit C5): a floating tag can move; a SHA cannot.

name: server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, lint, test (Node 22, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://kan:kan@localhost:55432/kan_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kan
          POSTGRES_PASSWORD: kan
          POSTGRES_DB: kan
        ports:
          # Same host port as server/app/docker-compose.yml, so the tests
          # point at one URL locally and in CI.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kan -d kan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: server/app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The whole suite: unit tests plus the client-flow e2e suite.
      - name: Test
        run: npm test
