# Recommended production stack: Cloudflare Tunnel in front of the API
# (see DEPLOY.md). No published ports at all; the host's public IP (also the
# Nebula lighthouse) stays hidden, TLS terminates at Cloudflare's edge, and
# cloudflared reaches the app on the compose network as http://app:3000.
#
# Memory budget for the whole stack: <= 700 MB
# (app 300 + postgres 320 + cloudflared 64 = 684 MB).
# Configuration comes from deploy/.env (never committed).
# The alternative direct-exposure stack (Caddy) is docker-compose.prod.yml.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kan-server:latest
    container_name: kan-server-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://kan:${POSTGRES_PASSWORD}@postgres:5432/kan
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-kan-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-kan-public-client}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-86400}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SCORE_TOKEN_TTL_SECONDS: ${SCORE_TOKEN_TTL_SECONDS:-1800}
      # Behind the tunnel: trust Cloudflare's CF-Connecting-IP for rate
      # limiting and use https in generated URLs. Only Cloudflare's edge (via
      # the tunnel) can reach the app here, so the header cannot be spoofed;
      # never set this when anything else can talk to the app directly.
      TRUST_PROXY: ${TRUST_PROXY:-cloudflare}
      # Browsers that open the API root go to the website (empty: JSON only).
      WEBSITE_URL: ${WEBSITE_URL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_LOCAL_DIR: /data
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      DOWNLOAD_URL_EXPIRY_SECONDS: ${DOWNLOAD_URL_EXPIRY_SECONDS:-300}
    volumes:
      # Level archives and covers when STORAGE_DRIVER=local.
      - kan-storage:/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 300m
    # Not published anywhere: only cloudflared talks to it.
    # Hardening: no Linux capabilities, no privilege gain, read-only image,
    # bounded processes. It may write only /data (the storage volume) and /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    networks: [db, edge]

  postgres:
    image: postgres:16-alpine
    container_name: kan-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kan
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
    volumes:
      - kan-postgres-data:/var/lib/postgresql/data
    mem_limit: 320m
    # Only the capabilities the image's entrypoint needs to hand the data
    # directory to the postgres user; no network but the internal one.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kan -d kan"]
      interval: 10s
      timeout: 3s
      retries: 12

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kan-server-cloudflared
    restart: unless-stopped
    # Runs the remotely-managed tunnel created in the Cloudflare dashboard
    # (Zero Trust -> Networks -> Tunnels); the token carries the credentials
    # and the ingress rules, e.g. api.<domain> -> http://app:3000.
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    networks: [edge]

networks:
  # The database network has no route out at all (internal): postgres can
  # talk to the app and nothing else.
  db:
    internal: true
  # The app and the tunnel: outbound only, to Cloudflare (tunnel, R2).
  # deploy/egress-guard.sh keeps it away from the host, the VPC, the AWS
  # metadata service and the Nebula overlay.
  edge: {}

volumes:
  kan-postgres-data:
  kan-storage:
